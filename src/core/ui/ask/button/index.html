<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #222;
            color: #f1f1f1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        button {
            background-color: #333;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold;
            padding: 4px;
            border: none;
            border-radius: 4px;
            color: #f1f1f1;
            cursor: pointer;
        }

        div {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
    <h3 id="q">a</h3>
    <div>
        <button onclick="send(true)">Yes</button>
        <button onclick="send(false)">No</button>
        <button onclick="send(false)">Cancel</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const question = params.get("question");
        document.getElementById("q").innerText = question;

        function send(value) {
            window.electron.send("ask-button-response", value)
        };

        document.addEventListener("keydown", async (e) => {
            if (e.key.toLowerCase() === "enter") {
                send(true);
            }

            if (e.key.toLowerCase() === "escape") {
                send(false);
            }
        });
    </script>
</body>
</html>
