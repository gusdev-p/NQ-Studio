<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../core/renderer.css"> <!-- PATH -->
    <script src="script.js"></script> <!-- PATH -->
    <script src="../core/renderer.js" type="module"></script> <!-- PATH -->
    <style>
        #editor {
            width: 100%;
            height: 100%;
        }
        body {
            overflow: hidden;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .selected {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .xterm-helper-textarea {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            left: -9999px;
        }

        .xterm-helpers {
            height: 1px;
            position: absolute;
            overflow: hidden;
        }

        #terminal,
        #terminalContent,
        .xterm {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
</body>
</html>
